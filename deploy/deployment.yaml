metadata:
  name: go-trader
  namespace: rileyseaburg
  labels:
    app.kubernetes.io/name: go-trader
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: go-trader
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP