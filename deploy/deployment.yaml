apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-trader
  namespace: rileyseaburg
  labels:
    app.kubernetes.io/name: go-trader
    app.kubernetes.io/part-of: rileyseaburg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: go-trader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-trader
        app.kubernetes.io/part-of: rileyseaburg
    spec:
      imagePullSecrets:
        - name: gcp-artifact-registry
      # distroless `nonroot` is UID 65532 — pod-level securityContext
      # provides the numeric ID kubelet needs to verify runAsNonRoot.
      # The Rust image keeps the same UID/GID for compatibility.
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trader
          # Image tag is patched at deploy time — see deploy/build-and-push.sh.
          image: us-central1-docker.pkg.dev/spotlessbinco/spotlessbinco/go-trader:placeholder
          imagePullPolicy: IfNotPresent
          args: ["--port", "8080", "--auto-trade", "--symbols", "AAPL,MSFT,TSLA,CBRS", "--symbols-file", "/app/config/universe-sp500.txt", "--active-symbol-limit", "75", "--max-universe-symbols", "1000", "--db-path", "/app/data/go-trader.sqlite3"]
          env:
            # Software low-latency mode: stream-first event evaluation with
            # millisecond gates while staying inside Alpaca API/broker constraints.
            # This is still paper/API trading, not FPGA/direct-market-access execution.
            - name: GO_TRADER_LOW_LATENCY_MODE
              value: "true"
            - name: GO_TRADER_AUTO_TRADE_INTERVAL_SECS
              value: "15"
            - name: GO_TRADER_MARKET_DATA_INTERVAL_SECS
              value: "1"
            - name: GO_TRADER_MARKET_DATA_INTERVAL_MS
              value: "5000"
            - name: GO_TRADER_SYMBOLS_FILE
              value: "/app/config/universe-sp500.txt"
            - name: GO_TRADER_ACTIVE_SYMBOL_LIMIT
              value: "75"
            - name: GO_TRADER_MAX_UNIVERSE_SYMBOLS
              value: "1000"
            - name: GO_TRADER_MARKET_DATA_STREAM_ENABLED
              value: "true"
            - name: GO_TRADER_SEED_BAR_COUNT
              value: "220"
            - name: GO_TRADER_SEED_BAR_DELAY_MS
              value: "1000"
            - name: GO_TRADER_SEED_BAR_MAX_RETRIES
              value: "5"
            - name: GO_TRADER_EVENT_DRIVEN_AUTO_TRADE
              value: "true"
            - name: GO_TRADER_EVENT_EVAL_INTERVAL_SECS
              value: "1"
            - name: GO_TRADER_EVENT_EVAL_INTERVAL_MS
              value: "100"
            - name: GO_TRADER_EVENT_ORDER_COOLDOWN_SECS
              value: "15"
            - name: GO_TRADER_EVENT_ORDER_COOLDOWN_MS
              value: "500"
            - name: GO_TRADER_AUTO_TRADE_MIN_CONFIDENCE
              value: "0.50"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: go-trader-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: audit-data
              mountPath: /app/data
            - name: symbol-universe
              mountPath: /app/config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: audit-data
          persistentVolumeClaim:
            claimName: go-trader-audit-data
        - name: symbol-universe
          configMap:
            name: go-trader-symbol-universe
---
